<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon</title>
  <style>
    html, body { margin:0; height:100%; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #6a11cb, #2575fc); font-family: system-ui, sans-serif; }
    h1 { color:white; font-size: 4rem; text-align:center; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .construction { width:80px; height:80px; border:5px solid white; border-top-color:transparent; border-radius:50%; margin-bottom:20px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .center { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  </style>
</head>
<body>
  <div class="center">
    <div class="construction"></div>
    <h1>Coming Soon</h1>
  </div>
</body>
</html>
